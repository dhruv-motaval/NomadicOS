<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Verification. 14 predicate types composable with all, any, not. Filesystem: file_exists, directory_exists, file_content_equals, file_contains, file_sha256, artifact_exists. Process output: exit_code_equals, stdout_contains, stdout_equals, stderr_contains. Runtime state: tests_pass, process_started, window_present, ui_element_present. Verdicts: PASS, NOT_PASS, NOT_VERIFIED, BLOCKED. SUCCESS is only reachable through goal verification."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7AFF0"/><stop offset="1" stop-color="#D29DEF"/></linearGradient></defs><rect width="1200" height="470" rx="22" fill="#0B0A08"/><circle cx="46" cy="47" r="6" fill="#BA9EFF"/><text x="64" y="52" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F0E8DB" text-anchor="start" letter-spacing="3">14 COMPLETION PREDICATES · COMPOSE WITH all / any / not</text><text x="40" y="111" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="0">Filesystem</text><rect x="210" y="92" width="100.5" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="260.26" y="110.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">file_exists</text><rect x="318.52" y="92" width="137.1" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="387.08" y="110.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">directory_exists</text><rect x="463.64" y="92" width="159.1" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="543.18" y="110.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">file_content_equals</text><rect x="630.72" y="92" width="115.2" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="688.3000000000001" y="110.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">file_contains</text><rect x="210" y="128" width="100.5" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="260.26" y="146.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">file_sha256</text><rect x="318.52" y="128" width="129.8" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="383.41999999999996" y="146.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">artifact_exists</text><text x="40" y="197" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="0">Process output</text><rect x="210" y="178" width="137.1" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="278.56" y="196.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">exit_code_equals</text><rect x="355.12" y="178" width="129.8" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="420.02" y="196.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">stdout_contains</text><rect x="492.92" y="178" width="115.2" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="550.5" y="196.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">stdout_equals</text><rect x="616.08" y="178" width="129.8" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="680.98" y="196.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">stderr_contains</text><text x="40" y="247" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="0">Runtime state</text><rect x="210" y="228" width="93.2" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="256.6" y="246.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">tests_pass</text><rect x="311.2" y="228" width="129.8" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="376.1" y="246.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">process_started</text><rect x="449.0" y="228" width="122.5" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="510.24" y="246.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">window_present</text><rect x="579.48" y="228" width="151.8" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="655.36" y="246.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">ui_element_present</text><text x="40" y="292" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">Unknown types are rejected. api_response_valid is always unverifiable.</text><rect x="860" y="80" width="300" height="350" rx="12" fill="#141210" stroke="url(#g)" stroke-width="2"/><text x="884" y="116" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="2">VERDICT</text><rect x="884" y="134" width="49.3" height="28" rx="14.0" fill="url(#g)"/><text x="908.64" y="152.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#0B0A08" text-anchor="middle" letter-spacing="0">PASS</text><text x="884" y="180" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">predicates held against evidence</text><rect x="884" y="198" width="78.6" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="923.28" y="216.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">NOT_PASS</text><text x="884" y="244" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">evidence shows it failed</text><rect x="884" y="262" width="107.8" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="937.92" y="280.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">NOT_VERIFIED</text><text x="884" y="308" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">nothing observable, no claim</text><rect x="884" y="326" width="71.2" height="28" rx="14.0" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="919.62" y="344.32" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F0E8DB" text-anchor="middle" letter-spacing="0">BLOCKED</text><text x="884" y="372" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">authority or policy stopped it</text><text x="884" y="410" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F0E8DB" text-anchor="start" letter-spacing="0">SUCCESS only via verification.</text></svg>
