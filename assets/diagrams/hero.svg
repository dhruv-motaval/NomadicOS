="190" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">  &quot;authority&quot;: {</text><text x="48" y="211" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">    &quot;epoch&quot;: 42,</text><text x="48" y="232" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">    &quot;grant&quot;: &quot;FULL_PC_AUTONOMY&quot;,</text><text x="48" y="253" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">    &quot;decision&quot;: &quot;ALLOW&quot;</text><text x="48" y="274" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">  },</text><text x="48" y="295" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">  &quot;evidence&quot;: [</text><text x="48" y="316" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">    { &quot;file_contains&quot;: &quot;hello.txt&quot; }</text><text x="48" y="337" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3A352E" text-anchor="start" letter-spacing="0" xml:space="preserve">  ],</text><text x="48" y="358" font-