<text x="210" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FF2E7E" text-anchor="middle" letter-spacing="1.6">1  UNTRUSTED</text>
<rect x="430" y="105" width="340" height="395" rx="16" fill="#2A52BE" fill-opacity="0.04" stroke="#2A52BE" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="430" y="105" width="340" height="38" rx="16" fill="#2A52BE" fill-opacity="0.12"/>
<text x="600" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A52BE" text-anchor="middle" letter-spacing="1.6">2  THE GATE</text>
<rect x="820" y="105" width="340" height="395" rx="16" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5"/>
<rect x="820" y="105" width="340" height="38" rx="16" fill="#0A0A0A" fill-opacity="0.12"/>
<text x="990" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0A0A0A" text-anchor="middle" letter-spacing="1.6">3  EXECUTION AND PROOF</text>
<rect x="60" y="160" width="300" height="52" rx="12" fill="#FFFFFF" stroke="#FF2E7E" stroke-width="1.6"/><text x="210.0" y="191.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >User goal</text>
<polygon points="203,215 217,215 210,223" fill="#FF2E7E"/>
<rect x="60" y="228" width="300" height="52" rx="12" fill="#FFFFFF" stroke="#FF2E7E" stroke-width="1.6"/><text x="210.0" y="259.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Task and planning</text>
<polygon points="203,283 217,283 210,291" fill="#FF2E7E"/>
<rect x="60" y="296" width="300" height="52" rx="12" fill="#FFFFFF" stroke="#FF2E7E" stroke-width="1.6"/><text x="210.0" y="327.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Model router</text>
<polygon points="203,351 217,351 210,359" fill="#FF2E7E"/>
<rect x="60" y="364" width="300" height="52" rx="12" fill="#FFFFFF" stroke="#FF2E7E" stroke-width="1.6"/><text x="210.0" y="395.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Worker / model</text>
<polygon points="203,419 217,419 210,427" fill="#FF2E7E"/>
<rect x="60" y="432" width="300" height="52" rx="12" fill="#FFFFFF" stroke="#FF2E7E" stroke-width="1.6"/><text x="210.0" y="454.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Action proposal</text><text x="210.0" y="475.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >just text, not authority</text>
<rect x="450" y="162" width="300" height="78" rx="12" fill="#FFFFFF" stroke="#2A52BE" stroke-width="1.6"/><text x="600.0" y="197.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Action IR + validation</text><text x="600.0" y="218.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >rejects authority-shaped fields</text>
<polygon points="593,245 607,245 600,253" fill="#2A52BE"/>
<rect x="450" y="262" width="300" height="78" rx="12" fill="#FFFFFF" stroke="#2A52BE" stroke-width="1.6"/><text x="600.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Policy + owner authority</text><text x="600.0" y="318.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >capability ceiling + explicit grant</text>
<polygon points="593,345 607,345 600,353" fill="#2A52BE"/>
<rect x="450" y="362" width="300" height="78" rx="12" fill="#FFFFFF" stroke="#2A52BE" stroke-width="1.6"/><text x="600.0" y="397.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >AuthorizedAction</text><text x="600.0" y="418.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >single-use, epoch-checked</text>
<rect x="500" y="448" width="200" height="34" rx="17.0" fill="#FF2E7E" fill-opacity="0.1" stroke="#FF2E7E" stroke-width="1.6"/><text x="600.0" y="469.375" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FF2E7E" text-anchor="middle" letter-spacing="1.2">DENIED  →  BLOCKED</text>
<rect x="840" y="160" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/><text x="990.0" y="187.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Executor</text><text x="990.0" y="208.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >filesystem, terminal, process</text>
<polygon points="983,225 997,225 990,233" fill="#0A0A0A"/>
<rect x="840" y="238" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/><text x="990.0" y="265.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Execution evidence</text><text x="990.0" y="286.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >attributable, recorded</text>
<polygon points="983,303 997,303 990,311" fill="#0A0A0A"/>
<rect x="840" y="316" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/><text x="990.0" y="343.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle" >Goal verifier</text><text x="990.0" y="364.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle" >predicates vs. evidence</text>
<rect x="840" y="392" width="146" height="36" rx="18.0" fill="#2A52BE" fill-opacity="0.08" stroke="#2A52BE" stroke-width="1.6"/><text x="913.0" y="414.375" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A52BE" text-anchor="middle" letter-spacing="1.2">PASS</text>
<rect x="994" y="392" width="146" height="36" rx="18.0" fill="#0A0A0A" fill-opacity="0.08" stroke="#0A0A0A" stroke-width="1.6"/><text x="1067.0" y="414.375" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="1.2">NOT_PASS</text>
<rect x="840" y="440" width="146" height="36" rx="18.0" fill="#FF2E7E" fill-opacity="0.08" stroke="#FF2E7E" stroke-width="1.6"/><text x="913.0" y="462.375" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FF2E7E" text-anchor="middle" letter-spacing="1.2">BLOCKED</text>
<rect x="994" y="440" width="146" height="36" rx="18.0" fill="#FF2E7E" fill-opacity="0.08" stroke="#FF2E7E" stroke-width="1.6"/><text x="1067.0" y="462.375" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FF2E7E" text-anchor="middle" letter-spacing="1.2">NOT_VERIFIED</text>
<polygon points="392,300 414,312 392,324" fill="#94A3B8"/>
<polygon points="782,300 804,312 782,324" fill="#94A3B8"/>
<text x="600" y="537" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle" >The model proposes · NomadicOS validates · Authority authorizes · The executor acts · The verifier proves</text>
</svg>
