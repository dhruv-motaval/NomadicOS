<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="NomadicOS pipeline: untrusted proposal, deterministic gate, execution and proof">
<rect x="1" y="1" width="1198" height="568" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="600" y="50" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle" >Model output never reaches the OS directly</text>
<text x="600" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle" >Every action crosses an untrusted zone, a deterministic gate, and an evidence check.</text>
<rect x="40" y="105" width="340" height="395" rx="16" fill="#FF2E7E" fill-opacity="0.04" stroke="#FF2E7E" stroke-opacity="0.45" stroke-width="1.5"/>
