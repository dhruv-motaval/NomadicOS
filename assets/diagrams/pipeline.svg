<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="NomadicOS pipeline: untrusted proposal, deterministic gate, execution and proof"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7AFF0"/><stop offset="1" stop-color="#D29DEF"/></linearGradient></defs><rect width="1200" height="580" rx="22" fill="#0B0A08"/><text x="40" y="58" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Model output never reaches the OS directly</text><text x="40" y="86" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">Every action crosses an untrusted zone, a deterministic gate, and an evidence check.</text><text x="40" y="132" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="2">1  UNTRUSTED</text><text x="440" y="132" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="url(#g)" text-anchor="start" letter-spacing="2">2  THE GATE</text><text x="820" y="132" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="2">3  EXECUTION AND PROOF</text><rect x="40" y="150" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="56" y="181.0" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">User goal</text><rect x="40" y="220" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="56" y="251.0" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Task and planning</text><path d="M210.0 202V214" stroke="#8C857A" stroke-width="1.5"/><path d="M206.0 213L210.0 219L214.0 213" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="40" y="290" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="56" y="321.0" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Model router</text><path d="M210.0 272V284" stroke="#8C857A" stroke-width="1.5"/><path d="M206.0 283L210.0 289L214.0 283" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="40" y="360" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="56" y="391.0" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Worker / model</text><path d="M210.0 342V354" stroke="#8C857A" stroke-width="1.5"/><path d="M206.0 353L210.0 359L214.0 353" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="40" y="430" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="56" y="452" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Action proposal</text><text x="56" y="470" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">just text, not authority</text><path d="M210.0 412V424" stroke="#8C857A" stroke-width="1.5"/><path d="M206.0 423L210.0 429L214.0 423" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="440" y="150" width="250" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="456" y="172" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Action IR + validation</text><text x="456" y="190" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">rejects authority-shaped fields</text><rect x="440" y="220" width="250" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="456" y="242" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Policy + owner authority</text><text x="456" y="260" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">ceiling + explicit grant</text><path d="M565.0 202V214" stroke="#8C857A" stroke-width="1.5"/><path d="M561.0 213L565.0 219L569.0 213" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="440" y="290" width="250" height="52" rx="10" fill="#141210" stroke="url(#g)" stroke-width="2"/><text x="456" y="312" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">AuthorizedAction</text><text x="456" y="330" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">single-use, epoch-checked</text><path d="M565.0 272V284" stroke="#8C857A" stroke-width="1.5"/><path d="M561.0 283L565.0 289L569.0 283" fill="none" stroke="#8C857A" stroke-width="1.5"/><path d="M690 246.0L712 246.0" fill="none" stroke="#8C857A" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M705 242.0L711 246.0L705 250.0" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="712" y="220" width="88" height="52" rx="10" fill="none" stroke="#8C857A" stroke-width="1.5" stroke-dasharray="5 5"/><text x="756" y="242" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#8C857A" text-anchor="middle" letter-spacing="1">DENIED</text><text x="756" y="260" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#F0E8DB" text-anchor="middle" letter-spacing="1">BLOCKED</text><rect x="820" y="150" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="836" y="172" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Executor</text><text x="836" y="190" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">filesystem, terminal, process</text><rect x="820" y="220" width="340" height="52" rx="10" fill="#141210" stroke="#2A2621" stroke-width="1.5"/><text x="836" y="242" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Execution evidence</text><text x="836" y="260" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">attributable, recorded</text><path d="M990.0 202V214" stroke="#8C857A" stroke-width="1.5"/><path d="M986.0 213L990.0 219L994.0 213" fill="none" stroke="#8C857A" stroke-width="1.5"/><rect x="820" y="290" width="340" height="52" rx="10" fill="#141210" stroke="url(#g)" stroke-width="2"/><text x="836" y="312" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#F0E8DB" text-anchor="start" letter-spacing="0">Goal verifier</text><text x="836" y="330" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">predicates vs. evidence</text><path d="M990.0 272V284" stroke="#8C857A" stroke-width="1.5"/><path d="M986.0 283L990.0 289L994.0 283" fill="none" stroke="#8C857A" stroke-width="1.5"/><path d="M380 456.0L410 456.0L410 176.0L440 176.0" fill="none" stroke="#8C857A" stroke-width="1.5"/><path d="M433 172.0L439 176.0L433 180.0" fill="none" stroke="#8C857A" stroke-width="1.5"/><path d="M690 316.0L808 316.0L808 176.0L820 176.0" fill="none" stroke="#8C857A" stroke-width="1.5"/><path d="M813 172.0L819 176.0L813 180.0" fill="none" stroke="#8C857A" stroke-width="1.5"/><text x="820" y="366" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8C857A" text-anchor="start" letter-spacing="2">VERDICT</text><rect x="820" y="380" width="46.8" height="34" rx="17" fill="url(#g)"/><text x="843.4" y="402" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#0B0A08" text-anchor="middle" letter-spacing="0">PASS</text><rect x="872.8" y="380" width="79.6" height="34" rx="17" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="912.5999999999999" y="402" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8C857A" text-anchor="middle" letter-spacing="0">NOT_PASS</text><rect x="958.4" y="380" width="112.39999999999999" height="34" rx="17" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="1014.6" y="402" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8C857A" text-anchor="middle" letter-spacing="0">NOT_VERIFIED</text><rect x="1076.8" y="380" width="71.39999999999999" height="34" rx="17" fill="none" stroke="#2A2621" stroke-width="1.5"/><text x="1112.5" y="402" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8C857A" text-anchor="middle" letter-spacing="0">BLOCKED</text><text x="820" y="442" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8C857A" text-anchor="start" letter-spacing="0">SUCCESS only through goal verification.</text><path d="M40 522H1160" stroke="#2A2621" stroke-width="1"/><text x="600.0" y="552" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8C857A" text-anchor="middle" letter-spacing="0">The model proposes · NomadicOS validates · Authority authorizes · The executor acts · <tspan fill="url(#g)" font-weight="700">The verifier proves</tspan></text></svg>
