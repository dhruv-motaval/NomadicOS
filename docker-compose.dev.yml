services:
  postgres:
    image: postgres:16
    container_name: nomadicos-postgres
    environment:
      POSTGRES_USER: nomadicos
      POSTGRES_PASSWORD: nomadicos
      POSTGRES_DB: nomadicos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadicos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
