services:
  postgres:
    image: postgres:16
    container_name: nomadicos-postgres
    environment:
      POSTGRES_USER: nomadicos
      # Dev-only credential for the LOCAL container. Change it to a strong
      # value in your own environment (or load it from an .env file next to
      # this compose file). NOTE: POSTGRES_PASSWORD only initializes a NEW
      # data volume — an already-initialized volume keeps the role password
      # it was created with; change that role separately with
      #   ALTER ROLE nomadicos WITH PASSWORD '...';
      POSTGRES_PASSWORD: nomadicos
      POSTGRES_DB: nomadicos
    ports:
      # Loopback-only binding: the dev database is reachable from THIS host
      # on 127.0.0.1:5433 (integration tests read NOMADICOS_TEST_DSN,
      # defaulting to this port) and is NOT exposed to the network.
      # Remote access requires a separately reviewed deployment
      # configuration — do not broaden this mapping.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadicos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
