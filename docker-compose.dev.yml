# OPTIONAL (ADR-0031): the owner runs PostgreSQL natively on Windows.
# Keep this file for CI/reproducible environments only.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nomadicos-postgres-dev
    environment:
      POSTGRES_DB: nomadicos
      POSTGRES_USER: nomadicos
      POSTGRES_PASSWORD: nomadicos-dev
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadicos -d nomadicos"]
      interval: 5s
      timeout: 3s
      retries: 10
