models: {}
# Example cloud-inference block (SPEC §10). NOT loaded automatically: copy the
# `cloud:` section into config/config.yaml to enable it. Off by default.
#
# Credentials are NEVER written here. `api_key_env` is the NAME of an
# environment variable (or a key in the git-ignored root `.env`) that holds
# the secret, e.g.   $env:OPENROUTER_API_KEY = "..."   (PowerShell)
cloud:
  enabled: true
  # Development/qualification switch. When true, only models whose CURRENT
  # catalog metadata declares zero input AND output price are used. Missing,
  # stale, ambiguous or nonzero pricing excludes a model; there is no paid
  # fallback. Free quotas and rate limits still apply.
  free_only: true
  providers:
    openrouter:
      kind: openrouter                  # base_url defaults to https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    # local OmniRoute gateway (start it with `omniroute`; key from its dashboard -> Endpoints)
    omniroute:
      kind: openai_compatible
      base_url: http://localhost:20128/v1
      api_key_env: OMNIROUTE_API_KEY
      assume_structured_output: true  # its /models does not list parameters; output is still validated
      # owner assertion (2026-11-24): its free router lists no price; traces mark it declared_by=owner
      free_models: ["auto/best-free"]
    # An owner-configured OpenAI-compatible provider (https, or http on loopback only):
    # acme:
    #   kind: openai_compatible
    #   base_url: https://llm.acme.example/v1
    #   api_key_env: ACME_API_KEY
    #   assume_structured_output: true  # only if its /models does not say so
  # Owner allowlist of "<provider>/<model id>" patterns. EMPTY = nothing allowed.
  # Pick ids from the provider's catalog; these are examples only.
  allowed_models:
    - "openrouter/openrouter/free"       # OpenRouter's documented free router (only admitted if the catalog lists it at zero price)
    - "openrouter/*:free"
    # OmniRoute: under free_only only models its catalog declares at zero price
    # (or the provider's owner-declared free_models) are admitted
    - "omniroute/auto/best-free"
  # Optional labels for registry records (selection still goes through the router).
  roles:
    reasoning: ["openrouter/*:free"]
  max_catalog_age_s: 3600     # older pricing metadata is stale -> excluded under free_only
  request_timeout_s: 60
  total_timeout_s: 180        # hard cap for one request including retries + fallbacks
  max_retries: 2              # retries of the same model
  max_fallbacks: 2            # other admitted models tried after that
  retry_backoff_s: 1.0
  max_backoff_s: 20

inference:
  default_engine: llamacpp
  fallback_engine: ollama
  ollama_base_url: http://localhost:11434
  llama_server_bin: C:/Ai/llama.cpp/llama-server.exe
  models_dir: models
autonomy:
  profile: FULL_PC_AUTONOMY
  capabilities:
    - filesystem.*
    - terminal.*
    - git.*
    - process.*
    - desktop.*
routing:
  mode: BALANCED
budget:
  max_recoveries: 5
  worker_max_tokens: 12000  # coding worker writes whole files inside JSON; 900 truncates React files (ctx is 16384)
  worker_timeout_s: 900
orchestration:
  # NomadicBrain: set true to let the brain plan (planner) and propose actions (actor)
  brain_planner: true
  brain_actor: true
  brain_adaptive: true        # memory, attention, beliefs, metacognition, effort
  brain_deliberation: true    # predict + evaluate accepted candidates, then select
  brain_search_depth: 1       # 0 = roots only; each level adds model calls
  brain_role_routing: true    # monitor/predictor/evaluator use their routed model
