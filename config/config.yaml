models: {}
inference:
  default_engine: llamacpp
  fallback_engine: ollama
  ollama_base_url: http://localhost:11434
  llama_server_bin: C:/Ai/llama.cpp/llama-server.exe
  models_dir: models
autonomy:
  profile: FULL_PC_AUTONOMY
  capabilities:
    - filesystem.*
    - terminal.*
    - git.*
    - process.*
    - desktop.*
routing:
  mode: BALANCED
budget:
  max_recoveries: 5
orchestration:
  # NomadicBrain: set true to let the brain plan (planner) and propose actions (actor)
  brain_planner: false
  brain_actor: true
