[project]
name = "nomadicos"
version = "0.1.0"
description = "NomadicOS v0.1 — local-first autonomous AI operating environment (BP §368)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
nomadicos = "nomadicos.cli_interactive:main_entry"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomadicos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "hardware: requires real models/GPU/hardware — excluded from shared CI (ADR-0024)",
    "security: security invariant tests — a regression must fail CI (BP §294)",
    "slow: long-running tests",
    "integration: requires external services such as PostgreSQL (ADR-0009)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "pyautogui"
ignore_missing_imports = true
