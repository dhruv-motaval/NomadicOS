[project]
name = "nomadicos"
version = "0.2.0"
description = "NomadicOS — local-first AI operating/orchestration environment (rebuild per master spec)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=6.0",
]

[project.scripts]
nomadicos = "nomadicos.cli.app:main_entry"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
desktop = ["pyautogui>=0.9.54", "pillow>=10.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomadicos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-q --basetemp=.tmp-pytest"
markers = [
    "hardware: requires real local models / GPU / desktop hardware (run from the owner's machine)",
    "security: authority and completion-integrity invariant tests",
    "slow: long-running tests",
    "integration: requires external services such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyautogui", "PIL", "PIL.*", "psutil"]
ignore_missing_imports = true
